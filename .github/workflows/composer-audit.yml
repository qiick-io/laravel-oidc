name: Composer audit

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, intl, mbstring
          coverage: none
          tools: composer:v2

      # Libraries do not commit a lockfile. Resolve a fresh dependency set to
      # audit runtime and development dependencies, including transitives.
      - name: Resolve dependencies
        run: composer update --no-install --no-interaction --prefer-dist

      - name: Audit resolved dependencies
        run: composer audit --locked --no-interaction
