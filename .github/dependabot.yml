# Dependency updates (Luca, 2026-11-22): weekly, grouped, into develop.
# Security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]
    # phpseclib 4 moves every class to the phpseclib4 namespace, which the
    # validator and firebase/php-jwt do not support yet.
    ignore:
      - dependency-name: "phpseclib/phpseclib"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
